<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 692" role="img" aria-labelledby="alternat-routing-title alternat-routing-desc">
<title id="alternat-routing-title">Alternat Routing</title>
<desc id="alternat-routing-desc">Simplified alterNAT routing for one availability zone. A private workload uses a default route through an EC2 NAT instance and its Elastic IP. If a connectivity check fails or the instance is replaced, Lambda changes the route to a standby managed NAT gateway with a different Elastic IP. Both paths reach the internet through the VPC internet gateway. A replacement instance restores the instance route when it boots.</desc>
<defs>
<marker id="alternat-routing-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-accent, #72a8ff)"/></marker>
<marker id="alternat-routing-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-text-subtle, #b4bfce)"/></marker>
</defs>
<rect width="720" height="692" fill="#0b1220"/>
<text x="360" y="20" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">ONE AVAILABILITY ZONE · TWO POSSIBLE EGRESS PATHS</text>
<rect x="244" y="42" width="232" height="68" rx="10" fill="var(--color-surface, #111a28)" stroke="var(--color-border, #455062)" stroke-width="1.4"/>
<text x="360.0" y="71" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="var(--color-text, #f3f6fb)">Private workloads</text>
<text x="360.0" y="95" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">Outbound traffic</text>
<path d="M360 110 V139" fill="none" stroke="var(--color-accent, #72a8ff)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#alternat-routing-accent)"/>
<rect x="244" y="146" width="232" height="70" rx="10" fill="var(--color-accent-surface, #192c48)" stroke="var(--color-accent, #72a8ff)" stroke-width="1.4"/>
<text x="360.0" y="175" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="var(--color-accent, #72a8ff)">Private route table</text>
<text x="360.0" y="199" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">0.0.0.0/0</text>
<path d="M360 216 V238 H176 V281" fill="none" stroke="var(--color-accent, #72a8ff)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#alternat-routing-accent)"/>
<path d="M360 238 H544 V281" fill="none" stroke="var(--color-text-subtle, #b4bfce)" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#alternat-routing-muted)"/>
<text x="112" y="269" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="500" fill="var(--color-accent, #72a8ff)">NORMAL PATH</text>
<text x="626" y="269" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="500" fill="var(--color-text-subtle, #b4bfce)">FALLBACK PATH</text>
<rect x="32" y="288" width="288" height="102" rx="10" fill="var(--color-accent-surface, #192c48)" stroke="var(--color-accent, #72a8ff)" stroke-width="1.4"/>
<text x="176.0" y="317" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="var(--color-accent, #72a8ff)">EC2 NAT instance</text>
<text x="176.0" y="341" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">Auto Scaling group</text>
<text x="176.0" y="361" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">Elastic IP A</text>
<rect x="400" y="288" width="288" height="102" rx="10" fill="var(--color-surface, #111a28)" stroke="var(--color-border, #455062)" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="544.0" y="317" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="var(--color-text, #f3f6fb)">Managed NAT gateway</text>
<text x="544.0" y="341" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">Standby gateway</text>
<text x="544.0" y="361" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">Elastic IP B</text>
<path d="M176 390 V420 H360 V447" fill="none" stroke="var(--color-accent, #72a8ff)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#alternat-routing-accent)"/>
<path d="M544 390 V420 H360" fill="none" stroke="var(--color-text-subtle, #b4bfce)" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 5"/>
<rect x="244" y="454" width="232" height="64" rx="10" fill="var(--color-surface, #111a28)" stroke="var(--color-border, #455062)" stroke-width="1.4"/>
<text x="360.0" y="483" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="var(--color-text, #f3f6fb)">Internet gateway</text>
<text x="360.0" y="507" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">VPC egress</text>
<path d="M360 518 V545" fill="none" stroke="var(--color-accent, #72a8ff)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#alternat-routing-accent)"/>
<text x="360" y="568" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="500" fill="var(--color-text, #f3f6fb)">Internet</text>
<path d="M20 594 H700" fill="none" stroke="var(--color-border, #455062)" stroke-width="1.8" stroke-linejoin="round"/>
<text x="124" y="621" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="500" fill="var(--color-accent, #72a8ff)">DETECT</text>
<text x="124" y="648" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">Checks every minute</text>
<text x="124" y="668" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">or termination event</text>
<text x="360" y="621" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="500" fill="var(--color-accent, #72a8ff)">SWITCH</text>
<text x="360" y="648" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">Lambda updates</text>
<text x="360" y="668" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">the default route</text>
<text x="596" y="621" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="500" fill="var(--color-accent, #72a8ff)">RESTORE</text>
<text x="596" y="648" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">Replacement boots</text>
<text x="596" y="668" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="var(--color-text-subtle, #b4bfce)">and restores route</text>
</svg>
